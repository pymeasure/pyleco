name: PyLECO CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pyleco requirements
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=3.10
          cache-environment-key: pylatest-ubuntu-latest-mamba-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}
          cache-downloads: false
      - name: Python and Mamba version
        run: |
          python --version
          micromamba info
      - uses: ammaraskar/sphinx-problem-matcher@v1
      - name: Generate docs
        if: always()  # run even if the previous step failed
        working-directory: ./docs
        run: |
          echo "::add-matcher::.github/sphinx.json"
          make html SPHINXOPTS="-W --keep-going"
      - name: Run doctests
        if: always()  # run even if the previous step failed
        working-directory: ./docs
        run: |
          echo "::add-matcher::.github/sphinx.json"
          make doctest SPHINXOPTS="-W --keep-going"

  code_style:
    name: Static Code Style Checking
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
          cache: 'pip'
      - name: Install pyleco
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e .[dev]
      - name: Add venv to PATH for pyright
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Lint with ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --output-format github"
      - name: Type check with pyright
        if: success() || failure()
        uses: jakebailey/pyright-action@v3

  test_coverage:
    name: Code Coverage on codecov
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pyleco requirements
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment-key: pylatest-ubuntu-latest-mamba-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}
          cache-downloads: false
      - name: Python version
        run: python --version
      - name: Install Pyleco
        # If the pytest problem matcher stops working because of bad paths, do an editable install
        run: pip install -e .[dev]  # editable for covtest
      - name: Test for Coverage
        run: pytest --cov=pyleco --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage.xml,!./cache
          flags: unittests
          name: codecov-umbrella
          verbose: true

  test:
    name: Python ${{ matrix.python-version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pyleco requirements
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          cache-environment-key: py${{ matrix.python-version }}-${{ matrix.os }}-mamba-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}
          cache-downloads: false
      - name: Python version
        run: python --version
      - name: Install Pyleco
        # If the pytest problem matcher stops working because of bad paths, do an editable install
        run: pip install .[dev]
      - name: Pyleco version
        run: python -c "import pyleco;print(pyleco.__version__)"
      - name: Run pytest under Linux with xvfb
        if: runner.os == 'Linux'
        run: |
          echo "::add-matcher::.github/pytest.json"
          xvfb-run -a pytest
      - name: Run pytest under Windows
        if: runner.os == 'Windows'
        run: |
          echo "::add-matcher::.github/pytest.json"
          pytest
      - name: Run pytest under Mac without integration tests
        if: runner.os == 'macOS'
        run: |
          echo "::add-matcher::.github/pytest.json"
          pytest --ignore=tests/integration_tests

  ci_status:
    name: CI Status
    runs-on: "ubuntu-latest"
    needs: [docs, code_style, test_coverage, test]
    # Runs even when upstream jobs failed or were cancelled (!cancelled()), so that
    # this job — intended as the required status check ("merge check") for branch
    # protection — always reports a conclusion instead of staying pending/skipped.
    if: always()
    steps:
      - name: Aggregate results
        # 'skipped' is treated as a failure, so that an upstream job skipped via
        # an 'if:' condition cannot silently turn this aggregate check green.
        run: |
          echo "Result of 'docs': ${{ needs.docs.result }}"
          echo "Result of 'code_style': ${{ needs.code_style.result }}"
          echo "Result of 'test_coverage': ${{ needs.test_coverage.result }}"
          echo "Result of 'test': ${{ needs.test.result }}"
          # The GitHub expression is evaluated before the shell runs and
          # expands to 'true' or 'false', which bash executes as commands.
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more CI jobs did not succeed."
            exit 1
          else
            echo "All CI jobs succeeded."
            exit 0
          fi
